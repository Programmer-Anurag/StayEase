name: StayEase CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feature/*'
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: Backend CI (Dependency install, Syntax check, Unit tests)
  # ------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Tests & Validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test
        env:
          PORT: 8080
          NODE_ENV: test
          mongoDB_URL: mongodb://localhost:27017/test
          JWT_SECRET: ci_test_secret

  # ------------------------------------------------------------------
  # Job 2: Frontend CI (Linting & Production Build)
  # ------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend Bundle
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080
          VITE_CLOUD_NAME: ci_placeholder
          VITE_UPLOAD_PRESET: ci_placeholder

  # ------------------------------------------------------------------
  # Job 3: Docker Images Build & Validation
  # ------------------------------------------------------------------
  docker-build:
    name: Docker Multi-Stage Image Builds
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            stayease-backend:latest
            stayease-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: |
            stayease-frontend:latest
            stayease-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Build Verification Complete
        run: echo "Both Backend and Frontend Docker images built successfully!"
