services:
  mongo:
    image: mongo:7-jammy
    container_name: stayease-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-alpha.4
    container_name: stayease-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"  
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_URL: mongodb://admin:qwerty@mongo:27017/?authSource=admin
    depends_on:
      - mongo

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stayease-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      mongoDB_URL: mongodb://admin:qwerty@mongo:27017/StayEase?authSource=admin
      JWT_SECRET: "anuragyadav"
      CLOUD_NAME: dutqt18yd
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stayease-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_CLOUD_NAME: dutqt18yd
      VITE_UPLOAD_PRESET: "listing"
    depends_on:
      - backend

volumes:
  mongo-data:
